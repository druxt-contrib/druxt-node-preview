_meta:
  version: '1.0'
  entity_type: consumer
  uuid: 7e3f9a1c-2d4b-4c8e-a6f0-1b2c3d4e5f60
  default_langcode: en
  depends:
    5c1d7e2a-3b4f-4a6c-9d8e-2f1a0b9c8d7e: user
default:
  client_id:
    -
      value: e2e_druxt
  label:
    -
      value: 'E2E Druxt frontend'
  # The client credentials user owns the consumer, so its token may
  # register targets on it.
  owner_id:
    -
      entity: 5c1d7e2a-3b4f-4a6c-9d8e-2f1a0b9c8d7e
  user_id:
    -
      entity: 5c1d7e2a-3b4f-4a6c-9d8e-2f1a0b9c8d7e
  # run.sh puts a new random secret here for each run. The importer hashes it.
  secret:
    -
      value: E2E_CLIENT_SECRET
  confidential:
    -
      value: true
  grant_types:
    -
      value: client_credentials
  # The token gets this scope by default, and the scope gives the
  # registrar role.
  scopes:
    -
      scope_id: preview_targets
  third_party:
    -
      value: true
  is_default:
    -
      value: false
  status:
    -
      value: true
  # A target the frontend did not make. Registration must keep it.
  preview_targets:
    -
      label: Kept
      url: 'https://kept.example.com/preview?vm=[view_mode]#[jsonapi_node_preview]'
  preview_layouts:
    -
      value: default
