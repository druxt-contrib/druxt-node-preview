# Pinned toolchain. `mise install` gives every contributor and every CI job the
# same Node, so "works on my machine" is a statement about a version anyone can
# reproduce.
#
# The tasks below are the commands CI runs. Keeping them here rather than only
# in .gitlab-ci.yml means a maintainer can run exactly what the pipeline runs,
# and the pipeline stays a thin wrapper rather than a second source of truth.

[tools]
# PHP for the Drupal site the end to end suite builds (test/e2e/run.sh); Node
# for the module. The end to end suite itself runs Playwright on Node 20 or
# later, and runs the Druxt frontend on this Node beside it.
php = "8.3"
node = "16.20.1"

[tasks.install]
description = "Install dependencies with the manager package.json declares"
run = "corepack enable && corepack prepare --activate && npm ci"

[tasks.build]
description = "Build the module with siroc"
run = "npm run build"

[tasks.lint]
description = "Run every linter"
run = "npm run lint"

[tasks."lint:js"]
description = "Lint the sources, templates, tests and scripts"
run = "npm run lint:js"

[tasks."lint:md"]
description = "Lint Markdown"
run = "npm run lint:md"

[tasks."lint:cspell"]
description = "Spell-check the repository"
run = "npm run lint:cspell"

[tasks."lint:private"]
description = "Fail if a tracked file points at a host only a private network resolves"
run = "npm run lint:private"

[tasks."lint:knip"]
description = "Find unused and undeclared dependencies"
run = "npm run lint:knip"

[tasks."lint:audit"]
description = "Audit shipped dependencies"
run = "npm run lint:audit"

[tasks.test]
description = "Run the unit tests"
run = "npm test"

[tasks."test:e2e"]
description = "Run the end to end suite against a local Drupal and frontends (needs PHP and Composer)"
# Playwright needs Node 20 or later. test/e2e/run.sh starts the Druxt
# frontend on Node 16 itself.
run = "mise x node@20 -- npm run test:e2e:stack"

[tasks."lint:prose"]
description = "Install Vale if needed, then lint the prose"
run = "npm run lint:prose:install && npm run lint:prose"

[tasks.ci]
description = "Everything the pipelines run, except the end to end suite"
depends = ["lint", "lint:audit", "lint:prose", "build", "test"]

# ---------------------------------------------------------------------------
# Git hooks. Run once per clone. `npm install` does this for you via
# scripts/postinstall.mjs; this task is here for the case where someone has
# skipped install scripts.
# ---------------------------------------------------------------------------
[tasks."hooks:install"]
description = "Point git at the committed .githooks/ directory"
run = "git config core.hooksPath .githooks"
