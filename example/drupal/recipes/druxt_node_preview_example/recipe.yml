name: 'Druxt Node Preview example'
description: 'Sets up the example backend for druxt-node-preview: Consumer Node Preview, Paragraphs and Druxt, a Landing page type with a field of Text paragraphs, a sample Landing page, and a consumer whose preview target is the example Nuxt app.'
type: 'Content type'
install:
  - consumer_node_preview
  - paragraphs
  - druxt
config:
  # Import only the config the site lacks, so the recipe also applies to a site
  # that already has some of it, such as the end to end suite's.
  strict: false
  actions:
    # The Druxt frontend reads the site's schema as an anonymous user.
    user.role.anonymous:
      grantPermissions:
        - 'access druxt resources'
